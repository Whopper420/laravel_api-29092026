name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch/PR when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Root app: plain React + JSX. No typecheck, so we just build.
  build-root:
    name: Build root (JSX)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # Root app: unit + component tests via Vitest (jsdom + Testing Library).
  test-root:
    name: Test root (JSX)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # TypeScript port: typecheck (strict), then build.
  build-typescript-port:
    name: Typecheck & build typescript-port
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript-port
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript-port/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # TypeScript port: unit + component tests via Vitest (jsdom + Testing Library).
  test-typescript-port:
    name: Test typescript-port
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript-port
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: typescript-port/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Optional gate: a single status check that only passes when everything
  # above is green. Point your branch protection at this one job.
  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [build-root, test-root, build-typescript-port, test-typescript-port]
    steps:
      - name: All jobs green
        run: echo "Build, typecheck and tests all passed."
