<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Laravel Posts</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="header">
      <div class="container">
        <h1>Laravel Posts</h1>

        <div id="userArea">
          <span id="userInfo">Not logged in</span>
          <button id="logoutBtn" class="hidden">Logout</button>
        </div>
      </div>
    </header>

    <main class="container">
      <!-- =========================
         AUTH SECTION
    ========================== -->

      <section id="authSection" class="card">
        <div class="auth-tabs">
          <button id="showLoginBtn" class="tab active">Login</button>

          <button id="showRegisterBtn" class="tab">Register</button>
        </div>

        <!-- LOGIN -->

        <form id="loginForm">
          <h2>Login</h2>

          <div class="form-group">
            <label for="loginEmail"> Email </label>

            <input type="email" id="loginEmail" required />
          </div>

          <div class="form-group">
            <label for="loginPassword"> Password </label>

            <input type="password" id="loginPassword" required />
          </div>

          <button type="submit">Login</button>
        </form>

        <!-- REGISTER -->

        <form id="registerForm" class="hidden">
          <h2>Create Account</h2>

          <div class="form-group">
            <label for="registerName"> Name </label>

            <input type="text" id="registerName" required />
          </div>

          <div class="form-group">
            <label for="registerEmail"> Email </label>

            <input type="email" id="registerEmail" required />
          </div>

          <div class="form-group">
            <label for="registerPassword"> Password </label>

            <input type="password" id="registerPassword" required />
          </div>

          <div class="form-group">
            <label for="registerPasswordConfirmation"> Confirm Password </label>

            <input type="password" id="registerPasswordConfirmation" required />
          </div>

          <button type="submit">Register</button>
        </form>

        <p id="authMessage"></p>
      </section>

      <!-- =========================
         POSTS SECTION
    ========================== -->

      <section id="postsSection" class="hidden">
        <div class="section-header">
          <h2>Posts</h2>

          <button id="showPostsBtn">Load Posts</button>
        </div>

        <!-- CREATE POST -->

        <div class="card">
          <h2>Create Post</h2>

          <form id="createPostForm">
            <div class="form-group">
              <label for="postTitle"> Title </label>

              <input type="text" id="postTitle" maxlength="255" required />
            </div>

            <div class="form-group">
              <label for="postBody"> Body </label>

              <textarea id="postBody" rows="5" required></textarea>
            </div>

            <button type="submit">Create Post</button>
          </form>
        </div>

        <!-- EDIT POST -->

        <div id="editContainer" class="card hidden">
          <h2>Edit Post</h2>

          <form id="editPostForm">
            <input type="hidden" id="editPostId" />

            <div class="form-group">
              <label for="editPostTitle"> Title </label>

              <input type="text" id="editPostTitle" maxlength="255" required />
            </div>

            <div class="form-group">
              <label for="editPostBody"> Body </label>

              <textarea id="editPostBody" rows="5" required></textarea>
            </div>

            <div class="button-row">
              <button type="submit">Update Post</button>

              <button type="button" id="cancelEditBtn" class="secondary">
                Cancel
              </button>
            </div>
          </form>
        </div>

        <!-- POSTS -->

        <div id="postsContainer">
          <p>Click "Load Posts" to see your posts.</p>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
